<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI決算アナリスト</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js (グラフ用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { main: '#25B2C7', base: '#60C7D5' },
                        textblack: '#2F3842',
                        accentorange: '#F77261',
                        stone: '#596572',
                        lightborder: '#F7F7F8',
                        mint: { main: '#42B187', base: '#60D5A9' },
                        accentyellow: { main: '#C4BF4D', base: '#E5EB67' },
                        ivory: { main: '#CBC2B3', base: '#F8F6ED' },
                        blue: '#4984BD'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { color: #2F3842; background-color: #F8F6ED; }
        .card { background-color: #FFFFFF; border: 1px solid #F7F7F8; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .ai-text strong { color: #25B2C7; font-weight: 700; }
        .loader {
            border: 4px solid #F7F7F8; border-top: 4px solid #25B2C7; border-radius: 50%;
            width: 48px; height: 48px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-lightborder px-6 py-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center">
            <h1 class="text-xl font-bold text-primary-main tracking-widest">AI FINANCIAL ANALYST</h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10">
        
        <!-- アップロードフォーム -->
        <section class="card p-8 mb-10">
            <h2 class="text-xl font-bold text-textblack mb-6">決算資料のアップロード ✨</h2>
            <form id="uploadForm" class="flex flex-col md:flex-row gap-6 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-bold text-stone mb-2">📄 決算短信 (PDF) <span class="text-accentorange text-xs ml-1">*必須</span></label>
                    <input type="file" name="tanshin" accept=".pdf" required
                        class="block w-full text-sm text-stone file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-primary-base file:text-white hover:file:bg-primary-main border border-lightborder rounded-full p-1 cursor-pointer transition-colors">
                </div>
                <div class="flex-1 w-full">
                    <label class="block text-sm font-bold text-stone mb-2">📊 決算説明資料 (PDF) <span class="text-ivory-main text-xs ml-1">任意</span></label>
                    <input type="file" name="presentation" accept=".pdf"
                        class="block w-full text-sm text-stone file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-ivory-base file:text-stone hover:file:bg-gray-200 border border-lightborder rounded-full p-1 cursor-pointer transition-colors">
                </div>
                <button type="submit" id="submitBtn" 
                    class="bg-primary-main hover:opacity-90 text-white font-bold py-3.5 px-10 rounded-full transition-all w-full md:w-auto shadow-md transform hover:-translate-y-0.5">
                    解析スタート
                </button>
            </form>
        </section>

        <!-- ローディング表示 -->
        <div id="loadingArea" class="hidden flex flex-col items-center justify-center py-20">
            <div class="loader mb-6"></div>
            <p class="text-lg font-bold text-primary-main">AIが資料を読み込み、分析しています...</p>
            <p class="text-sm text-stone mt-2">（※深く考察するため1〜2分ほどかかります。ワクワクしながらお待ちください♪）</p>
        </div>

        <!-- 結果表示エリア -->
        <div id="resultArea" class="hidden space-y-8">
            
            <!-- 企業ヘッダー -->
            <div class="card p-8 border-l-8 border-primary-main flex justify-between items-end">
                <div>
                    <p class="text-sm text-stone font-bold mb-2" id="resFiscalYear"></p>
                    <h2 class="text-3xl font-bold text-textblack"><span id="resCompany"></span> <span class="text-xl text-ivory-main font-normal ml-2" id="resCode"></span></h2>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                
                <!-- 左側：AIインサイト（2カラム） -->
                <div class="xl:col-span-2 space-y-8">
                    <div class="card p-8">
                        <h3 class="text-xl font-bold text-textblack mb-6 border-b border-lightborder pb-3 flex items-center">
                            <span class="text-2xl mr-3">💡</span> プロフェッショナル・インサイト
                        </h3>
                        
                        <div class="mb-8">
                            <h4 class="text-sm font-bold text-mint-main bg-mint-base bg-opacity-20 px-4 py-2 rounded-full mb-4 inline-block">当期の業績・財務の実態</h4>
                            <div id="aiTab1" class="ai-text text-textblack leading-relaxed space-y-3 text-sm whitespace-pre-wrap"></div>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-accentorange bg-orange-50 px-4 py-2 rounded-full mb-4 inline-block">来期の見通し・カタリストとリスク</h4>
                            <div id="aiTab2" class="ai-text text-textblack leading-relaxed space-y-3 text-sm whitespace-pre-wrap"></div>
                        </div>
                    </div>

                    <!-- グラフエリア (P/L & B/S) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- P/L グラフ -->
                        <div class="card p-6">
                            <h4 class="text-sm font-bold text-stone mb-4 text-center">業績推移と来期予想 (P/L)</h4>
                            <canvas id="plChart"></canvas>
                        </div>
                        <!-- B/S グラフ -->
                        <div class="card p-6">
                            <h4 class="text-sm font-bold text-stone mb-4 text-center">財務構造 (B/S)</h4>
                            <canvas id="bsChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 右側：主要KPIダッシュボード（1カラム） -->
                <div class="space-y-6">
                    <!-- PL情報 -->
                    <div class="card p-6">
                        <h4 class="text-xs font-bold text-stone uppercase tracking-wider mb-4 border-b border-lightborder pb-2">当期 損益状況 (百万円)</h4>
                        <div class="mb-5">
                            <p class="text-xs text-stone mb-1 font-bold" id="lblSales">売上高</p>
                            <p class="text-2xl font-bold text-textblack" id="valSales"></p>
                        </div>
                        <div class="mb-5">
                            <p class="text-xs text-stone mb-1 font-bold" id="lblOpProfit">営業利益</p>
                            <p class="text-2xl font-bold text-textblack" id="valOpProfit"></p>
                        </div>
                        <div>
                            <p class="text-xs text-stone mb-1 font-bold">純利益</p>
                            <p class="text-2xl font-bold text-textblack" id="valNetProfit"></p>
                        </div>
                    </div>

                    <!-- 財務安全性 -->
                    <div class="card p-6">
                        <h4 class="text-xs font-bold text-stone uppercase tracking-wider mb-4 border-b border-lightborder pb-2">財務安全性 (百万円)</h4>
                        <div class="flex justify-between items-end mb-4">
                            <div>
                                <p class="text-xs text-stone mb-1 font-bold">総資産</p>
                                <p class="text-xl font-bold text-textblack" id="valAssets"></p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-stone mb-1 font-bold">純資産</p>
                                <p class="text-xl font-bold text-textblack" id="valEquity"></p>
                            </div>
                        </div>
                        <div class="mt-2">
                            <div class="flex justify-between text-xs mb-2">
                                <span class="font-bold text-stone">自己資本比率 (推定)</span>
                                <span class="font-bold text-primary-main" id="valEquityRatio">%</span>
                            </div>
                            <div class="w-full bg-ivory-base rounded-full h-2.5">
                                <div class="bg-primary-main h-2.5 rounded-full" id="barEquityRatio" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- キャッシュフロー -->
                    <div class="card p-6">
                        <h4 class="text-xs font-bold text-stone uppercase tracking-wider mb-4 border-b border-lightborder pb-2">キャッシュフロー (百万円)</h4>
                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between">
                                <span class="text-stone font-bold">営業CF</span>
                                <span class="font-bold text-textblack" id="valCfOp"></span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-stone font-bold">投資CF</span>
                                <span class="font-bold text-textblack" id="valCfInv"></span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-stone font-bold">財務CF</span>
                                <span class="font-bold text-textblack" id="valCfFin"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Markdownの太字を変換
        function parseMarkdownBold(text) {
            if (!text) return "";
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        // カンマ区切り
        function fmt(num) {
            if (num === null || num === undefined) return "-";
            return Number(num).toLocaleString();
        }

        let plChartInstance = null;
        let bsChartInstance = null;

        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingArea = document.getElementById('loadingArea');
        const resultArea = document.getElementById('resultArea');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loadingArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            
            const formData = new FormData(e.target);
            
            try {
                const uploadRes = await fetch('/upload', { method: 'POST', body: formData });
                if (!uploadRes.ok) throw new Error(`サーバーエラー: ${uploadRes.status}`);
                
                const uploadData = await uploadRes.json();
                if (!uploadData.success) throw new Error(uploadData.error);
                
                pollStatus(uploadData.job_id);
            } catch (error) {
                console.error("通信エラー:", error);
                alert("エラーが発生しました: " + error.message);
                resetUI();
            }
        });

        async function pollStatus(jobId) {
            try {
                const res = await fetch(`/status/${jobId}`);
                const result = await res.json();
                
                if (result.status === 'processing') {
                    setTimeout(() => pollStatus(jobId), 3000);
                } else if (result.status === 'done') {
                    renderDashboard(result.data);
                } else if (result.status === 'error') {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error("ポーリング中エラー:", error);
                alert("解析中にエラーが発生しました: " + error.message);
                resetUI();
            }
        }

        function renderDashboard(data) {
            // 基本情報
            document.getElementById('resCompany').textContent = data.company || "不明な企業";
            document.getElementById('resCode').textContent = data.code ? `(${data.code})` : "";
            document.getElementById('resFiscalYear').textContent = data.fiscal_year || "";

            // AIインサイト
            if(data.ai_analysis) {
                document.getElementById('aiTab1').innerHTML = parseMarkdownBold(data.ai_analysis.tab1_summary);
                document.getElementById('aiTab2').innerHTML = parseMarkdownBold(data.ai_analysis.tab2_summary);
            }

            // ラベル
            if(data.labels) {
                document.getElementById('lblSales').textContent = data.labels.sales || "売上高";
                document.getElementById('lblOpProfit').textContent = data.labels.op_profit || "営業利益";
            }

            // 右側の数値群
            document.getElementById('valSales').textContent = fmt(data.pl_sales_now);
            document.getElementById('valOpProfit').textContent = fmt(data.pl_op_profit_now);
            document.getElementById('valNetProfit').textContent = fmt(data.pl_net_profit_now);

            const assets = data.bs_total_assets_now || 0;
            const equity = data.bs_equity || 0;
            document.getElementById('valAssets').textContent = fmt(assets);
            document.getElementById('valEquity').textContent = fmt(equity);

            let ratio = 0;
            if(assets > 0 && equity > 0) ratio = ((equity / assets) * 100).toFixed(1);
            document.getElementById('valEquityRatio').textContent = `${ratio}%`;
            document.getElementById('barEquityRatio').style.width = `${Math.min(ratio, 100)}%`;

            document.getElementById('valCfOp').textContent = fmt(data.cf_operating);
            document.getElementById('valCfInv').textContent = fmt(data.cf_investing);
            document.getElementById('valCfFin').textContent = fmt(data.cf_financing);

            // ==========================================
            // 📊 グラフの描画 (Chart.js)
            // ==========================================
            Chart.defaults.font.family = '"Noto Sans JP", sans-serif';
            Chart.defaults.color = '#596572'; // Stone

            // 1. P/L グラフ (棒グラフ)
            if (plChartInstance) plChartInstance.destroy();
            const ctxPl = document.getElementById('plChart').getContext('2d');
            
            const forecastSales = data.forecast_data ? data.forecast_data.sales : 0;
            const forecastOpProfit = data.forecast_data ? data.forecast_data.op_profit : 0;
            const forecastNetProfit = data.forecast_data ? data.forecast_data.net_profit : 0;

            plChartInstance = new Chart(ctxPl, {
                type: 'bar',
                data: {
                    labels: ['売上高', '営業利益', '純利益'],
                    datasets: [
                        {
                            label: '前期',
                            data: [data.pl_sales_prev, data.pl_op_profit_prev, data.pl_net_profit_prev],
                            backgroundColor: '#CBC2B3', // Ivory Main
                            borderRadius: 4
                        },
                        {
                            label: '当期',
                            data: [data.pl_sales_now, data.pl_op_profit_now, data.pl_net_profit_now],
                            backgroundColor: '#25B2C7', // Turquoise Main
                            borderRadius: 4
                        },
                        {
                            label: '来期(予想)',
                            data: [forecastSales, forecastOpProfit, forecastNetProfit],
                            backgroundColor: '#F77261', // AccentOrange
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'top' } }
                }
            });

            // 2. B/S グラフ (積み上げ棒グラフ) - 修正版
            if (bsChartInstance) bsChartInstance.destroy();
            const ctxBs = document.getElementById('bsChart').getContext('2d');
            
            // 下から上に順番に積み上がるようにデータセットを再構築・色分離
            bsChartInstance = new Chart(ctxBs, {
                type: 'bar',
                data: {
                    labels: ['前期 資産', '前期 負債/純資産', '当期 資産', '当期 負債/純資産'],
                    datasets: [
                        // --- 資産の部 ---
                        {
                            label: '流動資産',
                            data: [data.bs_current_assets_prev, 0, data.bs_current_assets, 0],
                            backgroundColor: '#25B2C7' // Turquoise Main
                        },
                        {
                            label: '固定資産',
                            data: [data.bs_fixed_assets_prev, 0, data.bs_fixed_assets, 0],
                            backgroundColor: '#4984BD' // Blue
                        },
                        // --- 負債・純資産の部 ---
                        {
                            label: '流動負債',
                            data: [0, data.bs_current_liabilities_prev, 0, data.bs_current_liabilities],
                            backgroundColor: '#42B187' // Mint Main
                        },
                        {
                            label: '固定負債',
                            data: [0, data.bs_fixed_liabilities_prev, 0, data.bs_fixed_liabilities],
                            backgroundColor: '#C4BF4D' // AccentYellow Main
                        },
                        {
                            label: '純資産',
                            data: [0, data.bs_equity_prev, 0, data.bs_equity],
                            backgroundColor: '#F77261' // AccentOrange
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true }
                    },
                    plugins: { legend: { position: 'top' } }
                }
            });

            // UI切り替え
            loadingArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50');
        }

        function resetUI() {
            loadingArea.classList.add('hidden');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50');
        }
    </script>
</body>
</html>
